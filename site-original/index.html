    <script>
    var cnpjInput = document.getElementById('documento_consulta');
    
    cnpjInput.addEventListener('input', function(e) {
        var value = this.value.replace(/\D/g, '').substring(0, 14);
        this.value = formatCNPJ(value);
    });
    
    cnpjInput.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && ['a', 'c', 'v'].includes(e.key.toLowerCase())) return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') { e.preventDefault(); return; }
        if (e.shiftKey && e.key === 'Insert') return;
        if (['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
        if (!/[0-9]/.test(e.key)) e.preventDefault();
    });
    
    cnpjInput.addEventListener('drop', function(e) { e.preventDefault(); });
    
    function formatCNPJ(value) {
        if (!value) return '';
        value = value.replace(/\D/g, '').substring(0, 14);
        var formatted = value;
        if (value.length > 2) formatted = formatted.replace(/^(\d{2})(\d)/, '$1.$2');
        if (value.length > 5) formatted = formatted.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
        if (value.length > 8) formatted = formatted.replace(/^(\d{2})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3/$4');
        if (value.length > 12) formatted = formatted.replace(/^(\d{2})\.(\d{3})\.(\d{3})\/(\d{4})(\d)/, '$1.$2.$3/$4-$5');
        return formatted;
    }
    
    document.getElementById('consultaForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var cnpj = cnpjInput.value.replace(/\D/g, '');
        var errorDiv = document.getElementById('error-message');
        var btn = document.getElementById('consultarBtn');
        var csrf_token = document.querySelector('input[name="csrf_token"]').value;
        
        errorDiv.style.display = 'none';
        
        if (cnpj.length !== 14) {
            errorDiv.textContent = 'CNPJ incompleto. Digite os 14 numeros.';
            errorDiv.style.display = 'block';
            btn.disabled = false;
            setTimeout(function() { errorDiv.style.display = 'none'; }, 5000);
            return;
        }
        
        // Validar CNPJ via API
        btn.disabled = true;
        var formData = new FormData();
        formData.append('cnpj', cnpj);
        formData.append('csrf_token', csrf_token);
        formData.append('action', 'validate');
        
        fetch('api_mei_direto.php', {
            method: 'POST',
            body: formData,
            credentials: 'same-origin',
            headers: { 'Accept': 'application/json' }
        })
        .then(function(response) { return response.json(); })
        .catch(function(error) { return { sucesso: false, mensagem: 'Erro ao consultar API' }; })
        .then(function(resultado) {
            btn.disabled = false;
            
            if (resultado && resultado.sucesso !== false) {
                cnpjInput.value = formatCNPJ(cnpj);
                
                setTimeout(function() {
                    document.getElementById('consultaForm').submit();
                }, 200);
            } else {
                var mensagem = resultado && resultado.mensagem 
                    ? resultado.mensagem 
                    : 'CNPJ nao localizado. Verifique os dados.';
                
                errorDiv.textContent = mensagem;
                errorDiv.style.display = 'block';
                setTimeout(function() { errorDiv.style.display = 'none'; }, 5000);
            }
        });
    });
    
    Ladda.bind('.ladda-button');
    cnpjInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('consultaForm').dispatchEvent(new Event('submit')); }
    });
    cnpjInput.focus();
    </script>
